[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "tool-selector-cascade"
version = "0.1.1"
description = "3-level cascading tool selector for AI agents: embedding → reranker → micro-LLM"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jean Bernard NDONGO AMBASSA", email = "ndongoambassa7@gmail.com" }]
requires-python = ">=3.11"
keywords = ["ai", "agents", "rag", "tool-selection", "embeddings", "reranker", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
level1 = ["sentence-transformers>=3.0.0"]
level2 = ["sentence-transformers>=3.0.0"]
level3-openai = ["openai>=2.31.0"]
level3-anthropic = ["anthropic>=0.94.0"]
level3-google = ["google-generativeai>=0.8.6"]
all = [
    "sentence-transformers>=3.0.0",
    "openai>=2.31.0",
    "anthropic>=0.94.0",
    "google-generativeai>=0.8.6",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "bandit[sarif]>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0",
    "build>=1.2.0",
]

[project.urls]
Repository = "https://github.com/bernard777/tool-selector-cascade"
Documentation = "https://github.com/bernard777/tool-selector-cascade#readme"
Issues = "https://github.com/bernard777/tool-selector-cascade/issues"
Changelog = "https://github.com/bernard777/tool-selector-cascade/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_selector_cascade"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Scripts contain long prose strings (prompts, docstrings) that cannot be wrapped
".github/scripts/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
