name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"          # v0.2.0
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+" # v0.2.0-rc1

permissions:
  contents: write     # Create GitHub Release
  id-token: write     # Trusted Publisher (PyPI OIDC)

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Validate the tag matches pyproject.toml version
  # ─────────────────────────────────────────────────────────────────────
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: extract
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Check pyproject.toml version matches tag
        run: |
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION=${{ steps.extract.outputs.version }}
          if [[ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]]; then
            echo "ERROR: pyproject.toml version ($PYPROJECT_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version $PYPROJECT_VERSION confirmed."

  # ─────────────────────────────────────────────────────────────────────
  # 2. Run full CI gate before releasing
  # ─────────────────────────────────────────────────────────────────────
  ci-gate:
    name: Full CI Gate
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev
        run: pip install -e ".[dev]" ruff black isort

      - name: Lint
        run: |
          ruff check .
          black --check .
          isort --check-only .

      - name: Type check
        run: mypy src/ --strict

      - name: Tests
        run: pytest tests/ -v --cov=src/tool_selector_cascade --cov-fail-under=80

  # ─────────────────────────────────────────────────────────────────────
  # 3. Build distribution
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: ci-gate
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build

      - name: Generate provenance hashes
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ─────────────────────────────────────────────────────────────────────
  # 4. Publish to PyPI (Trusted Publisher — no password)
  # ─────────────────────────────────────────────────────────────────────
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/tool-selector-cascade/
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  # ─────────────────────────────────────────────────────────────────────
  # 5. Create GitHub Release with CHANGELOG excerpt
  # ─────────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, pypi-publish]
    steps:
      - uses: actions/checkout@v6

      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          VERSION=${{ needs.validate-version.outputs.version || 'unknown' }}
          # Extract the section between this version header and the next
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "tool-selector-cascade ${{ github.ref_name }}"
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.notes }}

            ---
            **PyPI:** https://pypi.org/project/tool-selector-cascade/${{ needs.validate-version.outputs.version }}/
            **Full Changelog:** https://github.com/bernard777/tool-selector-cascade/blob/master/CHANGELOG.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
