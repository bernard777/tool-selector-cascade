name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly full scan every Monday at 02:00 UTC
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Bandit — Python SAST
  # ─────────────────────────────────────────────────────────────────────
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bandit with SARIF support
        run: pip install bandit[sarif]

      - name: Run Bandit
        run: |
          bandit -r src/ \
            -ll \
            --format sarif \
            --output bandit-results.sarif \
            --exit-zero
          # Also print in readable format
          bandit -r src/ -ll --format text || true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  # ─────────────────────────────────────────────────────────────────────
  # 2. pip-audit — known vulnerability scanning
  # ─────────────────────────────────────────────────────────────────────
  pip-audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit direct dependencies
        run: |
          pip install -e ".[all,dev]"
          pip-audit --strict --desc on

  # ─────────────────────────────────────────────────────────────────────
  # 3. CodeQL — deep static analysis
  # ─────────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # ─────────────────────────────────────────────────────────────────────
  # 4. Dependency Review — on PRs only (blocks if vulnerabilities found)
  # ─────────────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  # ─────────────────────────────────────────────────────────────────────
  # 5. Secret scanning — detect accidental credential commits
  # ─────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
