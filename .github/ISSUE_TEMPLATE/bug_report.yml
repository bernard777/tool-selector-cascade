---
name: Bug Report
description: Report a reproducible bug in tool-selector-cascade
title: "bug: <short description>"
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug!
        Please fill in all sections — incomplete reports may be closed.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I call `select_tools_for_intent(...)` with X, it returns Y instead of Z."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal code snippet or steps to reproduce the issue.
      render: python
      placeholder: |
        from tool_selector_cascade import select_tools_for_intent
        # ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include full error traceback if available.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Library Version
      description: Output of `python -c "import tool_selector_cascade; print(tool_selector_cascade.__version__)"`
      placeholder: "0.1.1"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: "Python 3.11.9"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: level
    attributes:
      label: Affected Level
      multiple: true
      options:
        - Level 1 (Embedding)
        - Level 2 (Reranker)
        - Level 3 (Micro-LLM)
        - CascadeSelector / cascade.py
        - Configuration
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else that might be relevant (LLM provider, model, network, etc.)
